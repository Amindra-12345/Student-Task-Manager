services:

  mongodb:
    image: mongo:8
    container_name: student-task-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./server
    image: student-task-backend:latest
    container_name: student-task-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/student-task-manager
      CLIENT_ORIGIN: http://localhost:5173
      JWT_SECRET: change-me-to-a-long-random-string
      JWT_EXPIRES_IN: 7d
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./client
    image: student-task-frontend:latest
    container_name: student-task-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongodb_data: